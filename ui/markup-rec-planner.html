<section class="v3-panel v4-shell mobile-active planner-mode-view" id="recPlannerView" aria-label="Recreational dive parameters">
<div class="panel-header-row">
<div class="panel-title-wrap">
<div class="panel-title">Dive Parameters</div>
<span class="tip-icon" id="recPlanPanelTip" onclick="showTip('Dive Parameters','Recreational dive planning: depth, bottom time, breathing gas, and optional safety stop. NDL limits are computed from PADI recreational tables.')"><svg fill="none" height="11" viewbox="0 0 11 11" width="11" xmlns="http://www.w3.org/2000/svg"><circle cx="5.5" cy="5.5" r="5" stroke="currentColor" stroke-width="1.1"></circle><path d="M4.1 3.8 Q4.1 2.4 5.5 2.4 Q6.9 2.4 6.9 3.7 Q6.9 4.6 5.5 5.3 L5.5 6.2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.1"></path><circle cx="5.5" cy="7.4" fill="currentColor" r="0.55"></circle></svg></span>
</div>
<div class="panel-header-actions">
<button class="btn-export" id="recPresetsHeaderBtn" onclick="openDiveProfilePresets()" title="Save / load dive profile (depth &amp; BT)"><svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="16"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg></button>
</div>
</div>
<div class="depth-bt-row" id="recDepthBtSteppers">
<div class="input-card">
<div class="input-card-label" id="recDepthLbl">Depth</div>
<div class="input-card-inner">
<div><span class="stepper-val" id="recDepthStepperVal">40</span><span class="unit" id="recDepthUnitLbl">m</span></div>
<div class="stepper-btns">
<button type="button" class="stepper-btn" onclick="stepRecDepthBt('depth',1)" aria-label="Increase depth">+</button>
<button type="button" class="stepper-btn" onclick="stepRecDepthBt('depth',-1)" aria-label="Decrease depth">−</button>
</div>
</div>
<input type="hidden" id="recDepth" value="40" oninput="_syncRecDepthBtSteppers();updateGasMODDisplays()"/>
</div>
<div class="input-card">
<div class="input-card-label">Bottom Time</div>
<div class="input-card-inner">
<div><span class="stepper-val" id="recBtStepperVal">30</span><span class="unit">min</span></div>
<div class="stepper-btns">
<button type="button" class="stepper-btn" onclick="stepRecDepthBt('bt',1)" aria-label="Increase bottom time">+</button>
<button type="button" class="stepper-btn" onclick="stepRecDepthBt('bt',-1)" aria-label="Decrease bottom time">−</button>
</div>
</div>
<input type="hidden" id="recBT" value="30" oninput="_syncRecDepthBtSteppers()"/>
</div>
</div>
<div class="ctrl-row" id="recSafetyStopRow">
<span class="ctrl-label" style="margin-left:0;">Safety Stop:</span>
<button type="button" class="option-pill-toggle" id="stopDepthToggle" onclick="toggleStopDepth()" aria-label="Toggle safety stop depth" data-side="right">
<span class="option-pill-track" style="--pill-w: 72px;">
<span class="option-pill-thumb" aria-hidden="true"></span>
<span class="option-pill-opt">3 m</span>
<span class="option-pill-opt">6 m</span>
</span>
</button>
<button type="button" class="option-pill-toggle" id="stopDurToggle" onclick="toggleStopDur()" aria-label="Toggle safety stop duration" data-side="left">
<span class="option-pill-track" style="--pill-w: 80px;">
<span class="option-pill-thumb" aria-hidden="true"></span>
<span class="option-pill-opt">3 min</span>
<span class="option-pill-opt">5 min</span>
</span>
</button>
</div>
<div class="field" id="gasMixField">
<label class="section-label">Breathing Gas</label>
<select id="gasMix" class="form-select-like" onchange="toggleCustomO2()">
<option value="air">Air (21%)</option>
<option value="ean32">EAN32 (32%)</option>
<option value="ean36">EAN36 (36%)</option>
<option value="custom">Custom O₂ %</option>
<option value="trimix">Trimix (O₂/He %)</option>
</select>
</div>
<div class="field" id="customO2Field" style="display:none;">
<label>O₂ % (21–100)</label>
<input id="customO2" max="100" min="21" oninput="updateGasMODDisplays()" step="1" type="number" value="32"/>
</div>
<div class="field gas-f-num" id="plannerTrimixO2Field" style="display:none;">
<label>Trimix O₂ % (5–40)</label>
<input id="plannerTrimixO2" max="40" min="5" step="1" type="number" value="21"/>
</div>
<div class="field gas-f-num" id="plannerTrimixHeField" style="display:none;">
<label>Trimix He % (0–90)</label>
<input id="plannerTrimixHe" max="90" min="0" step="1" type="number" value="35"/>
</div>
<button class="gen-btn" id="recGenerateBtn" onclick="runRecPlan()" type="button">▶ Generate schedule</button>
</section>
