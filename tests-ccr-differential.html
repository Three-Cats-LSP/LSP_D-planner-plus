<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LSP CCR Differential Tests</title>

<style>

  body { background:#0b0e17; color:#e4e8f0; font-family:'JetBrains Mono',monospace; font-size:12px; padding:20px; }

  h1 { color:#00d9ff; font-size:20px; }

  .pass { color:#26d07c; } .fail { color:#ff4757; } .warn { color:#ffd32a; } .inc { color:#a78bfa; }

  .summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; max-width:960px; margin:16px 0; }

  .summary-card { border:1px solid #263244; border-radius:8px; background:#111827; padding:12px; }

  .summary-card strong { display:block; font-size:20px; color:#e4e8f0; margin-bottom:4px; }

  .summary-card span { color:#8ea0b8; text-transform:uppercase; letter-spacing:.08em; font-size:10px; }

  table { border-collapse:collapse; width:100%; max-width:1200px; margin-top:14px; background:#0f1522; border:1px solid #263244; border-radius:8px; overflow:hidden; }

  th, td { border-bottom:1px solid #263244; padding:8px 10px; text-align:left; vertical-align:top; }

  th { color:#8ea0b8; text-transform:uppercase; letter-spacing:.08em; font-size:10px; background:#121b2a; }

  tr:last-child td { border-bottom:0; }

  .pill { display:inline-block; border-radius:999px; padding:2px 7px; font-weight:700; }

  .pill-pass { background:#123524; color:#26d07c; }

  .pill-inc { background:#2d2547; color:#a78bfa; }

  .pill-fail { background:#3c1620; color:#ff4757; }

  details { margin-top:18px; max-width:1200px; }

  summary { cursor:pointer; color:#8ea0b8; }

  pre { white-space:pre-wrap; max-height:420px; overflow:auto; border:1px solid #263244; border-radius:8px; padding:12px; background:#080c14; }

  #app-frame { display:none; }

</style>

</head>

<body>

<h1>CCR Engine Differential Suite</h1>

<div id="status">Waiting…</div>

<div id="results"></div>

<details>
  <summary>Raw JSON details</summary>
  <pre id="log"></pre>
</details>

<iframe id="app-frame"></iframe>

<script src="tests/ccr-differential/lib/ccrdiff.js"></script>

<script>

let WIN, CONFIG, EXPECTED, MANIFEST;



async function loadJson(url) {

  const r = await fetch(url);

  if (!r.ok) throw new Error('Failed to load ' + url);

  return r.json();

}



async function loadFixture(id) {

  return loadJson('tests/ccr-differential/fixtures/' + id + '.json');

}



async function loadGolden(engine, id) {

  try {

    const r = await fetch('tests/ccr-differential/goldens/' + engine + '/' + id + '.json');

    if (!r.ok) return null;

    return r.json();

  } catch (_) { return null; }

}



function waitForApp(iframe, timeoutMs) {

  return new Promise((resolve, reject) => {

    const start = Date.now();

    iframe.src = 'index.html?regression=1&massiveSuite=1&ts=' + Date.now();

    function enginesReady(w) {

      return !!(w && w.ZHLEngine && w.ZHLEngine.calculate && w.validateEngineInputs);

    }

    function armHeadless(w) {

      w._zhlHeadless = true;

      w._zhlHeadlessDepth = (w._zhlHeadlessDepth || 0) + 1;

    }

    const check = () => {

      try {

        const w = iframe.contentWindow;

        if (enginesReady(w)) {

          armHeadless(w);

          return setTimeout(() => {

            try {

              const w2 = iframe.contentWindow;

              if (enginesReady(w2)) {

                armHeadless(w2);

                return resolve(w2);

              }

            } catch (_) {}

            setTimeout(check, 250);

          }, 1200);

        }

      } catch (_) {}

      if (Date.now() - start > timeoutMs) return reject(new Error('Timed out waiting for LSP engines'));

      setTimeout(check, 250);

    };

    setTimeout(check, 250);

  });

}



function isRequiredGolden(config, engine, scenarioId) {

  const req = (config.requiredGoldens && config.requiredGoldens[engine]) || [];

  return req.indexOf(scenarioId) >= 0;

}



function isPartialCoverageEngine(config, engine) {

  const partial = config.partialCoverageEngines || [];

  return partial.indexOf(engine) >= 0;

}



function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}



function scenarioStatus(row) {
  if (row.error || row.integrity === 'FAIL') return 'FAIL';
  const comparisons = row.comparisons || [];
  if (comparisons.some(c => c.classification === 'LSP_SUSPECT')) return 'FAIL';
  if (comparisons.some(c => c.classification === 'INCONCLUSIVE')) return 'INCONCLUSIVE';
  if (comparisons.some(c => c.classification === 'EXPECTED_DIFFERENCE')) return 'EXPECTED';
  return 'PASS';
}



function renderSummary(summary) {
  const resultsEl = document.getElementById('results');
  if (!resultsEl) return;
  const rows = (summary.rows || []).filter(r => r.scenarioId && r.scenarioId !== '_effectiveness');
  const tableRows = rows.map(row => {
    const status = scenarioStatus(row);
    const pillClass = status === 'PASS' || status === 'EXPECTED' ? 'pill-pass' : status === 'INCONCLUSIVE' ? 'pill-inc' : 'pill-fail';
    const comps = (row.comparisons || []).map(c => `${escapeHtml(c.engine)}: ${escapeHtml(c.classification)}`).join('<br>');
    const meta = row.lsp && row.lsp.summary
      ? `RT ${escapeHtml(row.lsp.summary.runtimeMin)} min · First ${escapeHtml(row.lsp.summary.firstStopDepthM)} m · CNS ${escapeHtml(row.lsp.summary.cnsPercent)}`
      : '';
    return `<tr><td>${escapeHtml(row.scenarioId)}</td><td>${escapeHtml(row.description || '')}</td><td><span class="pill ${pillClass}">${escapeHtml(status)}</span></td><td>${meta}</td><td>${comps || escapeHtml(row.error || '')}</td></tr>`;
  }).join('');
  resultsEl.innerHTML = `
    <div class="summary-grid">
      <div class="summary-card"><strong>${escapeHtml(summary.scenarios)}</strong><span>Scenarios</span></div>
      <div class="summary-card"><strong>${escapeHtml(summary.failures)}</strong><span>Failures</span></div>
      <div class="summary-card"><strong>${escapeHtml(summary.inconclusive)}</strong><span>Inconclusive</span></div>
      <div class="summary-card"><strong>${escapeHtml(summary.appVersion)}</strong><span>App Version</span></div>
    </div>
    <table>
      <thead><tr><th>Scenario</th><th>Description</th><th>Status</th><th>LSP Summary</th><th>Comparisons</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  `;
}



async function runAll() {

  const logEl = document.getElementById('log');

  const statusEl = document.getElementById('status');

  statusEl.textContent = 'Loading config…';

  CONFIG = await loadJson('tests/ccr-differential/config.json');

  EXPECTED = await loadJson('tests/ccr-differential/expected-differences.json');

  MANIFEST = await loadJson('tests/ccr-differential/manifest.json');



  statusEl.textContent = 'Booting LSP…';

  WIN = await waitForApp(document.getElementById('app-frame'), 180000);

  const meta = {

    version: WIN.APP_VERSION,

    commit: 'not_available',

    inputChecksum: MANIFEST.inputsChecksum,

  };



  const rows = [];

  let failures = 0;

  let inconclusive = 0;

  let missingRequired = 0;



  for (const id of MANIFEST.fixtureIds) {

    const fx = await loadFixture(id);

    CCRDiff.validateFixtureShape(fx);

    const row = { scenarioId: id, description: fx.description, lsp: null, comparisons: [], metamorphic: [], integrity: 'PASS' };



    try {

      if (fx.expectInvalid) {

        row.lsp = CCRDiff.runLspScenario(WIN, fx, meta);

        row.integrity = row.lsp.error ? 'PASS' : 'FAIL';

        if (!row.lsp.error) failures++;

      } else {

        row.lsp = CCRDiff.runLspScenario(WIN, fx, meta);

      }

    } catch (e) {

      row.integrity = 'FAIL';

      row.error = e.message;

      failures++;

      rows.push(row);

      continue;

    }



    const comparators = (CONFIG.comparatorEngines && CONFIG.comparatorEngines.length)
      ? CONFIG.comparatorEngines
      : ['multideco', 'divekit', 'abysner', 'subsurface'];

    for (const engine of comparators) {

      const golden = await loadGolden(engine, id);

      if (!golden) {

        if (isPartialCoverageEngine(CONFIG, engine) && !isRequiredGolden(CONFIG, engine, id)) {

          continue;

        }

        const required = isRequiredGolden(CONFIG, engine, id);

        row.comparisons.push({

          engine: engine,

          classification: CCRDiff.CLASS.INCONCLUSIVE,

          detail: required ? 'required golden capture missing' : 'no golden capture',

          required: required,

        });

        inconclusive++;

        if (required) {

          missingRequired++;

          failures++;

        }

        continue;

      }

      const cmp = CCRDiff.compareSummaries(row.lsp, golden, fx, CONFIG, EXPECTED);

      row.comparisons.push({

        engine: golden.engine,

        classification: cmp.classification,

        issues: cmp.issues,

      });

      if (cmp.classification === CCRDiff.CLASS.LSP_SUSPECT && isRequiredGolden(CONFIG, engine, id)) failures++;

    }



    if (id === 'CCR-C1' && !fx.expectInvalid) {

      try {

        row.metamorphic = CCRDiff.runMetamorphic(WIN, fx, meta);

      } catch (e) {

        row.metamorphic = [e.message];

        failures++;

      }

    }



    rows.push(row);

  }



  const effectiveness = CCRDiff.assertFixtureEffectiveness(rows, MANIFEST.fixtureEffectiveness || {});

  effectiveness.forEach(msg => {

    failures++;

    rows.push({ scenarioId: '_effectiveness', integrity: 'FAIL', error: msg, comparisons: [], metamorphic: [] });

  });



  const summary = {

    appVersion: WIN.APP_VERSION,

    scenarios: MANIFEST.fixtureIds.length,

    failures,

    inconclusive,

    missingRequired,

    pass: failures === 0,

    rows,

    generatedAt: new Date().toISOString(),

  };



  renderSummary(summary);

  logEl.textContent = JSON.stringify(summary, null, 2);

  statusEl.innerHTML = failures

    ? '<span class="fail">FAIL — ' + failures + ' issue(s)</span>'

    : '<span class="pass">PASS — ' + MANIFEST.fixtureIds.length + ' scenarios (' + inconclusive + ' inconclusive)</span>';

  return summary;

}



window.runCCRDiffAll = runAll;

if (!location.search.includes('autorun=0')) {

  window.addEventListener('load', () => {

    runAll().catch(e => {

      document.getElementById('status').innerHTML = '<span class="fail">' + e.message + '</span>';

      throw e;

    });

  });

}

</script>

</body>

</html>
