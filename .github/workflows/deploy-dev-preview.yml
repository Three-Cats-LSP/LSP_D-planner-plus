name: Deploy dev preview to GitHub Pages

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dev/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: dev
          path: development

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build production site
        working-directory: production
        run: python tools/build_pages_site.py

      - name: Build development preview
        working-directory: development
        run: python tools/build_pages_site.py

      - name: Test preview assembler
        working-directory: development
        run: python -m unittest tools.test_assemble_pages_preview

      - name: Assemble production and preview
        run: >-
          python development/tools/assemble_pages_preview.py
          --production production
          --development development
          --output _site
          --commit ${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
